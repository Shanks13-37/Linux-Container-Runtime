name: CI

on:
  push:
    branches: [ main, brs ]
  pull_request:
    branches: [ main, brs ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make

      - name: Build
        run: make
